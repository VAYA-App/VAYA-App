<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F5">
<title>VAYA M5-M6 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap">
<style>
/* Light theme only. Tokens mirror lib/app/theme/app_theme.dart (emerald "Siam Wanderlust":
   warm cream surface, white raised cards, emerald primary, sunset-orange tertiary).
   Roles the app does not set (primary-container, error) are approximations. */
:root {
  --primary: #006948; --on-primary: #FFFFFF;
  --primary-container: #8CF7C7; --on-primary-container: #002114;
  --secondary-container: #D5F0E3; --on-secondary-container: #005137;
  --tertiary: #A73A00; --on-tertiary: #FFFFFF; --tertiary-container: #FFDBCE; --on-tertiary-container: #370E00;
  --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #93000A;
  --surface: #FFF8F5; --on-surface: #1F1B17; --on-surface-variant: #3D4A42;
  --sc-lowest: #FFFFFF; --sc-low: #FCF2EB; --sc: #F6ECE6; --sc-high: #F0E6E0; --sc-highest: #EAE1DA;
  --outline: #6D7A72; --outline-variant: #BCCAC0;
  --inverse-surface: #342F2B; --inverse-on-surface: #F9EFE8; --inverse-primary: #6CDBAC;
  --scrim: rgba(0,0,0,.32); --stage: #E7DFD8;
  --c1: #006948; --c2: #A73A00; --c3: #00639B; --c4: #8E3A8C; --c5: #6D7A72; --c6: #8A6A00;
  --r-card: 20px; --r-btn: 16px; --r-field: 12px; --r-chip: 8px; --r-sheet: 28px;
  --ease: cubic-bezier(.2, 0, 0, 1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body { margin: 0; background: var(--stage); color: var(--on-surface); font-family: "Prompt", system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.ms { font-family: "Material Symbols Outlined"; font-weight: 400; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal;
  text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; font-feature-settings: "liga"; flex: none; user-select: none; }
.ms.fill { font-variation-settings: "FILL" 1; }

/* M3 type scale */
.display-s { font-size: 2.25rem; line-height: 2.75rem; font-weight: 600; }
.headline-s { font-size: 1.5rem; line-height: 2rem; font-weight: 600; }
.title-l { font-size: 1.375rem; line-height: 1.75rem; font-weight: 600; }
.title-m { font-size: 1rem; line-height: 1.5rem; font-weight: 500; }
.title-s { font-size: .875rem; line-height: 1.25rem; font-weight: 500; }
.body-l { font-size: 1rem; line-height: 1.5rem; }
.body-m { font-size: .875rem; line-height: 1.25rem; }
.body-s { font-size: .75rem; line-height: 1rem; }
.label-l { font-size: .875rem; line-height: 1.25rem; font-weight: 500; }
.label-m { font-size: .75rem; line-height: 1rem; font-weight: 500; }
.muted { color: var(--on-surface-variant); }
.num { font-variant-numeric: tabular-nums; }

/* ================= phone + safe areas =================
   On a real phone (<600px) the browser/OS supplies the status bar, camera cut-out and
   system buttons; we only honour env(safe-area-inset-*). On a larger screen we draw the
   phone and reserve the same insets so the layout shows where content must NOT go. */
.device { width: 100%; }
.app { --inset-top: env(safe-area-inset-top, 0px); --inset-bottom: env(safe-area-inset-bottom, 0px);
  position: relative; height: 100dvh; max-width: 480px; margin: 0 auto; overflow: hidden; background: var(--surface);
  display: flex; flex-direction: column; }
.sysbar, .navbar, .guide { display: none; }
@media (min-width: 600px) {
  body { display: grid; place-items: center; min-height: 100dvh; padding: 24px; }
  .device { width: 410px; padding: 10px; background: #1b1714; border-radius: 56px; box-shadow: 0 16px 48px rgba(0,0,0,.28); }
  .app { height: min(844px, calc(100dvh - 68px)); border-radius: 46px; }
  .app[data-cam="punch"]  { --inset-top: 44px; }
  .app[data-cam="notch"]  { --inset-top: 56px; }
  .app[data-cam="none"]   { --inset-top: 28px; }
  .app[data-nav="gesture"] { --inset-bottom: 26px; }
  .app[data-nav="buttons"] { --inset-bottom: 48px; }
  .app[data-cam="notch"][data-nav="gesture"] { --inset-bottom: 34px; }
  .sysbar { display: flex; position: absolute; z-index: 30; top: 0; left: 0; right: 0; height: var(--inset-top);
    align-items: center; justify-content: space-between; padding: 6px 28px 0; color: var(--on-surface); pointer-events: none; }
  .sysbar .time { font-weight: 600; font-size: .875rem; }
  .sysbar .icons { display: flex; gap: 4px; }
  .sysbar .icons .ms { font-size: 16px; }
  .cam { position: absolute; left: 50%; transform: translateX(-50%); background: #0b0908; z-index: 31; pointer-events: none; }
  .app[data-cam="punch"] .cam { top: 12px; width: 14px; height: 14px; border-radius: 50%; }
  .app[data-cam="notch"] .cam { top: 0; width: 124px; height: 32px; border-radius: 0 0 20px 20px; }
  .app[data-cam="none"] .cam { display: none; }
  .navbar { display: flex; position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; height: var(--inset-bottom);
    align-items: center; justify-content: center; pointer-events: none; }
  .navbar .pill { width: 120px; height: 4px; border-radius: 4px; background: rgba(31,27,23,.55); margin-top: 8px; }
  .app[data-nav="buttons"] .pill { display: none; }
  .navbar .btns { display: none; width: 100%; justify-content: space-around; padding: 0 56px; color: var(--on-surface); }
  .app[data-nav="buttons"] .btns { display: flex; }
  .navbar .btns .ms { font-size: 22px; }
  .guide { display: none; position: absolute; z-index: 29; left: 0; right: 0; pointer-events: none; align-items: center; justify-content: center;
    background: repeating-linear-gradient(45deg, rgba(186,26,26,.22) 0 6px, rgba(186,26,26,.1) 6px 12px); color: #93000A;
    font-size: .6875rem; font-weight: 600; border-block: 1px dashed rgba(186,26,26,.7); }
  .app.guides .guide { display: flex; }
  .guide.top { top: 0; height: var(--inset-top); }
  .guide.bottom { bottom: 0; height: var(--inset-bottom); }
}

/* ================= top app bar ================= */
.topbar { flex: none; display: flex; align-items: center; gap: 4px; padding: var(--inset-top) 4px 0 4px;
  min-height: calc(var(--inset-top) + 64px); background: var(--surface); transition: background .2s var(--ease); z-index: 2; }
.topbar.scrolled { background: var(--sc); }
.topbar h1 { flex: 1; min-width: 0; margin: 0; padding-left: 4px; color: var(--primary); }
.icon-btn { position: relative; width: 48px; height: 48px; border-radius: 999px; border: 0; background: transparent; display: grid;
  place-items: center; color: var(--on-surface-variant); flex: none; }
.icon-btn::before, .btn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity .15s; pointer-events: none; }
.icon-btn:hover::before, .btn:hover::before { opacity: .08; }
.icon-btn:active::before, .btn:active::before { opacity: .12; }

.main { position: relative; flex: 1; min-height: 0; }
.scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.page { padding: 4px 16px 24px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); overflow-wrap: anywhere; }

/* ================= buttons (radius 16 like the app's FilledButtonTheme) ================= */
.btn { position: relative; min-height: 52px; padding: 0 20px; border-radius: var(--r-btn); border: 0; text-decoration: none; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; font-weight: 500; }
.btn .ms { font-size: 20px; }
.btn.filled { background: var(--primary); color: var(--on-primary); }
.btn.tert { background: var(--tertiary); color: var(--on-tertiary); }
.btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn.outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
.btn.text { background: transparent; color: var(--primary); padding: 0 12px; min-height: 48px; }
.btn.block { width: 100%; }
.btn.small { min-height: 48px; }

/* ================= chips / status ================= */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 32px; padding: 0 12px 0 8px; border-radius: var(--r-chip); border: 1px solid var(--outline-variant); display: inline-flex;
  align-items: center; gap: 6px; color: var(--on-surface-variant); background: var(--sc-lowest); }
.chip .ms { font-size: 18px; color: var(--primary); }
.status { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px 0 8px; border-radius: var(--r-chip); }
.status .ms { font-size: 18px; }
.status.ok { background: var(--secondary-container); color: var(--on-secondary-container); }
.status.over { background: var(--error-container); color: var(--on-error-container); }
.daychips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.daychips::-webkit-scrollbar { display: none; }
.daychip { flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--outline-variant); background: var(--sc-lowest); }
.daychip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

/* ================= cards ================= */
.card { background: var(--sc-lowest); border: 1px solid color-mix(in srgb, var(--outline-variant) 60%, transparent); border-radius: var(--r-card); padding: 20px; }
.card.tint { background: var(--secondary-container); border-color: transparent; }
.hero { margin-top: 16px; padding: 16px; border-radius: 16px; background: var(--sc-low); }
.hero .big { color: var(--primary); }
.hero.over .big { color: var(--error); }
.split { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.split .per { color: var(--tertiary); }
.progress { position: relative; height: 6px; border-radius: 999px; background: var(--sc-highest); overflow: hidden; margin-top: 16px; }
.progress > i { position: absolute; inset: 0 auto 0 0; background: var(--primary); border-radius: 999px; transition: width .4s var(--ease); }
.progress.over > i { background: var(--error); }
.progress-cap { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; }
.note { margin: 16px 0 0; display: flex; gap: 8px; align-items: flex-start; }
.note .ms { font-size: 18px; margin-top: 1px; }

/* ================= over-budget banner (#38 + mascot #83) ================= */
.banner { border-radius: var(--r-card); padding: 16px; background: var(--error-container); color: var(--on-error-container);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.banner .txt { min-width: 0; }
.banner h2 { margin: 0; display: flex; gap: 6px; align-items: flex-start; }
.banner h2 .ms { font-size: 22px; flex: none; margin-top: 1px; }
.banner p { margin: 6px 0 0; }
.banner .mascot { width: 76px; height: 76px; object-fit: contain; }
.banner .act { grid-column: 1 / -1; justify-self: start; margin: 4px 0 -4px -12px; color: var(--on-error-container); }
html.big .banner .mascot { display: none; }   /* MASCOT.md: hide the mascot when large text needs the room */

.banner.soft { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.banner.soft .act { color: var(--on-tertiary-container); }
.sumlines { margin: 10px 0 0; display: grid; gap: 2px; color: var(--on-surface-variant); }
.sumlines > div { display: flex; justify-content: space-between; gap: 12px; }
.sumlines dt, .sumlines dd { margin: 0; }
.sumlines .sum { color: var(--on-surface); font-weight: 500; border-top: 1px solid var(--outline-variant); padding-top: 4px; margin-top: 2px; }
.flag { display: inline-block; vertical-align: middle; margin-left: 4px; padding: 1px 8px; border-radius: 999px; font-size: .6875rem; line-height: 1.125rem; font-weight: 500; }
.flag.est, .tag.est { background: var(--tertiary-container); color: var(--on-tertiary-container); border-color: transparent; }
.flag.real { background: var(--secondary-container); color: var(--on-secondary-container); }
.flag.warn { background: var(--error-container); color: var(--on-error-container); }
.unk { color: var(--tertiary); font-weight: 500; }
.rescue { margin-top: 12px; background: var(--tertiary-container); color: var(--on-tertiary-container); border-color: transparent; }
.rescue h3 { margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.rescue p { margin: 6px 0 0; }
.rescue .muted { color: inherit; opacity: .8; }
.rescue .acts { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rescue .btn { background: var(--sc-lowest); color: var(--tertiary); }
.rescue .tag { border-color: currentColor; background: transparent; }
.rules { margin-top: 16px; }
.rules summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; color: var(--on-surface); }
.rules ol { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 4px; }

/* ================= advice (#37) ================= */
.section-h { margin: 4px 4px 0; }
.advice-list { display: grid; gap: 12px; margin: 12px 0 0; padding: 0; list-style: none; }
.advice { padding: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; }
.advice .lead { width: 2.5rem; height: 2.5rem; border-radius: 999px; display: grid; place-items: center; background: var(--tertiary-container); color: var(--on-tertiary-container); }
.advice h3 { margin: 0; }
.advice .save { color: var(--tertiary); font-weight: 600; }
.advice .after { grid-column: 2; margin: 0; }
.advice .after strong { color: var(--on-surface); font-weight: 500; }
.advice .acts { grid-column: 2; margin: 8px 0 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 12px 0 8px; border-radius: var(--r-chip); border: 1px solid var(--outline-variant); }
.tag .ms { font-size: 18px; }

.li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; padding: 8px 0; min-height: 56px; align-items: center; }
.li .lead { width: 2.5rem; height: 2.5rem; border-radius: 999px; display: grid; place-items: center; background: var(--primary-container); color: var(--on-primary-container); }
.day-h { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
.day-h i { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }

/* ================= persistent cost row + bottom actions ================= */
.costbar { flex: none; display: none; align-items: center; gap: 12px; padding: 8px 16px; background: var(--sc); border-top: 1px solid var(--outline-variant); }
.costbar.show { display: flex; }
.costbar .grow { flex: 1; min-width: 0; }
.costbar .amt { color: var(--primary); }
.costbar.over .amt { color: var(--error); }
.actions { flex: none; display: flex; gap: 12px; padding: 12px 16px calc(12px + var(--inset-bottom)); background: var(--surface);
  border-top: 1px solid color-mix(in srgb, var(--outline-variant) 50%, transparent); }
.actions .btn { flex: 1; min-width: 0; padding: 0 12px; }

/* large text: stack the actions and drop the duplicate total row so the content keeps its room */
html.big .actions { flex-direction: column; gap: 8px; }
html.big .costbar.show { display: none; }

/* ================= modal bottom sheet ================= */
.scrim { position: absolute; inset: 0; z-index: 8; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity .25s var(--ease), visibility 0s .25s; }
.scrim.open { opacity: 1; visibility: visible; transition: opacity .25s var(--ease); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 90%; display: flex; flex-direction: column; background: var(--sc-low);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0; transform: translateY(105%); visibility: hidden; transition: transform .3s var(--ease), visibility 0s .3s; }
.sheet.open { transform: translateY(0); visibility: visible; transition: transform .3s var(--ease); }
.sheet .grab { flex: none; padding: 16px 0 8px; touch-action: none; cursor: grab; }
.sheet .grab i { display: block; width: 32px; height: 4px; border-radius: 999px; background: var(--on-surface-variant); opacity: .4; margin: 0 auto; }
.sheet .body { overflow-y: auto; padding: 0 16px calc(24px + var(--inset-bottom)); overflow-wrap: anywhere; }
.sheet-head { display: flex; align-items: center; gap: 8px; }
.sheet-head h2 { flex: 1; margin: 0; }
.stack { display: flex; gap: 2px; height: 8px; margin: 16px 0 8px; }
.stack i { display: block; min-width: 4px; border-radius: 2px; }
.row-li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 16px; align-items: center; min-height: 64px; padding: 8px 0; }
.row-li .lead { width: 2.5rem; height: 2.5rem; border-radius: 999px; display: grid; place-items: center; background: var(--sc-lowest); }
.row-li .lead .ms { font-size: 22px; }
.row-li .trail { text-align: right; }
.divider { height: 1px; background: var(--outline-variant); margin: 8px 0; }
.assume { margin-top: 16px; padding: 12px 16px; border-radius: var(--r-field); background: var(--sc); display: flex; gap: 12px; }
.assume .ms { font-size: 20px; }

/* lab (settings) form */
.field { position: relative; display: block; margin-top: 20px; }
.field > span { position: absolute; top: -10px; left: 12px; padding: 0 4px; background: var(--sc-low); z-index: 1; color: var(--on-surface-variant); }
.field select, .field input[type=number] { width: 100%; min-height: 56px; padding: 0 16px; border-radius: var(--r-field); border: 1px solid var(--outline); background: transparent; }
.field select:focus, .field input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
.stepper { display: flex; align-items: center; border: 1px solid var(--outline); border-radius: var(--r-field); min-height: 56px; padding: 0 4px; }
.stepper output { flex: 1; text-align: center; }
.seg { display: flex; border: 1px solid var(--outline); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.seg button { flex: 1; min-height: 40px; padding: 0 8px; background: transparent; border: 0; border-left: 1px solid var(--outline); display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--secondary-container); color: var(--on-secondary-container); }
.seg button[aria-pressed="true"]::before { content: "✓"; }
.switch-row { display: flex; align-items: center; gap: 16px; min-height: 56px; }
.switch-row span { flex: 1; }
.switch { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 52px; height: 32px; border-radius: 999px; border: 2px solid var(--outline); background: var(--sc-highest); transition: background .2s var(--ease); margin: 0; }
.switch::after { content: ""; position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline); transform: translateY(-50%); transition: all .2s var(--ease); }
.switch:checked { background: var(--primary); border-color: var(--primary); }
.switch:checked::after { left: 22px; width: 24px; height: 24px; background: var(--on-primary); }

.snack { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 6; min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px;
  border-radius: 8px; background: var(--inverse-surface); color: var(--inverse-on-surface); transform: translateY(160%); visibility: hidden; transition: transform .25s var(--ease), visibility 0s .25s; }
.snack.show { transform: translateY(0); visibility: visible; transition: transform .25s var(--ease); }
.snack span { flex: 1; }
.snack .btn { color: var(--inverse-primary); min-height: 40px; }
</style>
</head>
<body>

<div class="device">
<div class="app" id="app" data-cam="punch" data-nav="gesture">
  <!-- drawn phone chrome (only on screens ≥600px) -->
  <div class="sysbar" aria-hidden="true"><span class="time">9:41</span>
    <span class="icons"><span class="ms fill">signal_cellular_alt</span><span class="ms fill">wifi</span><span class="ms fill">battery_full</span></span></div>
  <div class="cam" aria-hidden="true"></div>
  <div class="guide top" aria-hidden="true"></div>
  <div class="guide bottom" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <button class="icon-btn" type="button" aria-label="กลับ"><span class="ms" aria-hidden="true">arrow_back</span></button>
    <h1 class="title-l" id="app-title">ชลบุรี</h1>
    <button class="icon-btn" type="button" id="open-settings" aria-label="ตัวเลือกทดลอง" aria-haspopup="dialog"><span class="ms" aria-hidden="true">tune</span></button>
    <button class="icon-btn" type="button" aria-label="แชร์แผน"><span class="ms" aria-hidden="true">share</span></button>
  </header>

  <div class="main">
    <div class="scroll" id="scroll"><main class="page" id="page"></main></div>
    <div class="snack" id="snack" role="status" aria-live="polite"><span id="snack-text"></span><button class="btn text" type="button" id="snack-undo">เลิกทำ</button></div>
  </div>

  <div class="costbar" id="costbar">
    <div class="grow"><div class="label-m muted" id="costbar-label">ค่าใช้จ่ายรวม</div><div class="title-l amt num" id="costbar-amt"></div></div>
    <button class="btn tonal small" type="button" id="costbar-open">รายละเอียด</button>
  </div>
  <div class="actions">
    <button class="btn outlined" type="button"><span class="ms" aria-hidden="true">bookmark_border</span>บันทึกทริป</button>

<script>
"use strict";
const PRICE = {
  room: {1: 700, 2: 1500, 3: 3000, 4: 6000}, meal: {1: 80, 2: 200, 3: 450, 4: 1000},
  breakfast: 100, breakfastIncludedFrom: 3,                    // prototype assumption

           taxi: {base: 40, km: 12, cap: 4}, publicTransport: {trip: 30} },
  intercity: {bus: {fare: 131}, train: {fare: 31}, car: {km: 150, rate: 2.5, toll: 120}},
  buffer: 0.10,
  min: {stopsPerDay: 4}                                          // assumption used by the minimum trip cost
};
const LOCAL_LABEL = {rentalCar: "เช่ารถยนต์", rentalMotorbike: "เช่ามอเตอร์ไซค์", taxi: "Grab/แท็กซี่", publicTransport: "รถสาธารณะ"};
const IC_LABEL = {bus: "รถทัวร์/รถตู้", train: "รถไฟ", car: "ขับรถเอง"};
const DATES = ["ส. 14 พ.ย.", "อา. 15 พ.ย.", "จ. 16 พ.ย."];
const A = (name, km, fee = 0) => ({name, cat: "attr", km, fee});
const R = (name, km, level) => ({name, cat: "rest", km, level});
/* Real rows from สถานที่กรุงเทพ_พร้อมนำเข้า.xlsx (sheet places): n=name c=category l=priceLevel f=entranceFee
   (foreigner adult price, as in the file) ft=entranceFeeThai. */
const BKK = {"grand-palace":{"n":"วัดพระศรีรัตนศาสดาราม","c":"attr","lat":13.7515,"lng":100.4927,"l":2,"f":500,"ft":0},"thong-heng-lee":{"n":"Thong Heng Lee Restaurant","c":"rest","lat":13.7526785,"lng":100.4893907,"l":1,"f":0,"ft":0},"wat-pho":{"n":"วัดพระเชตุพนวิมลมังคลาราม","c":"attr","lat":13.74642,"lng":100.49277,"l":1,"f":300,"ft":0},"wat-arun":{"n":"วัดอรุณราชวรารามราชวรมหาวิหาร","c":"attr","lat":13.74387,"lng":100.48844,"l":1,"f":200,"ft":0},"baan-tha-tien":{"n":"Baan ThaTien","c":"rest","lat":13.7446855,"lng":100.4922468,"l":2,"f":0,"ft":0},"the-gate-grand-palace":{"n":"The Gate Grand Palace","c":"rest","lat":13.7521738,"lng":100.4891456,"l":2,"f":0,"ft":0},"rongros":{"n":"RONGROS","c":"rest","lat":13.7442546,"lng":100.4917087,"l":3,"f":0,"ft":0},"mahanakhon-skywalk":{"n":"SkyWalk King Power Mahanakhon","c":"attr","lat":13.72401,"lng":100.52848,"l":3,"f":880,"ft":880},"mahanakhon-eatery":{"n":"Mahanakhon Eatery","c":"rest","lat":13.7239054,"lng":100.5286479,"l":2,"f":0,"ft":0},"iconsiam":{"n":"ไอคอนสยาม","c":"attr","lat":13.72623,"lng":100.51045,"l":2,"f":0,"ft":0}};
const BKK_CENTER = {lat: 13.7563, lng: 100.5018};
function hav(a, b) { const r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLn = r(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLn / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(h))); }
/* same rule as lib/planner/geo.dart: straight line x 1.3, one decimal */
const bkkBack = ids => Math.round(hav(BKK[ids[ids.length - 1]], BKK_CENTER) * 1.3 * 10) / 10;
function bkkDay(ids, from = BKK_CENTER) { let prev = from;
  return ids.map(id => { const d = BKK[id], km = Math.round(hav(prev, d) * 1.3 * 10) / 10; prev = d;
    return d.c === "attr" ? {name: d.n, cat: "attr", km, fee: d.f, feeThai: d.ft, src: "excel"}
                          : {name: d.n, cat: "rest", km, level: d.l, src: "excel"}; }); }

const SCENARIOS = {
  demo1: { province: "ชลบุรี", tagsLabel: "ทะเล & คาเฟ่", n: 2, budget: 7000, tier: 3, local: "publicTransport", intercity: "bus", sameProvince: false, back: [1.4, null], days: [
    [A("ปราสาทสัจธรรม", 8, 500), R("ลานโพธิ์ นาเกลือ", 2, 2), A("พัทยา วิวพอยท์", 10), R("Pier 21 พัทยา", 4, 1)],
    [A("หาดจอมเทียน", 9), R("ตลาดหนองมน", 48, 1), A("หาดบางแสน", 4), A("เขาสามมุข", 3)]] },
  demo3: { province: "ชลบุรี", tagsLabel: "ทะเล & ซีฟู้ด", n: 4, budget: 3000, tier: 3, local: "publicTransport", intercity: "bus", sameProvince: false, back: [1.4, null, null], days: [
    [A("ปราสาทสัจธรรม", 8, 500), R("ร้านอาหารทะเลนาเกลือ", 2, 1), A("พัทยา วิวพอยท์", 10), R("Pier 21 พัทยา", 4, 1)],
    [A("หาดจอมเทียน", 9), R("ตลาดหนองมน", 48, 1), A("หาดบางแสน", 4), R("ร้านข้าวแกงบางแสน", 3, 1)],
    [A("เขาสามมุข", 3), R("ก๋วยเตี๋ยวศรีราชา", 18, 1)]] },
  bkk1: { province: "กรุงเทพฯ", tagsLabel: "วัด & ประวัติศาสตร์", n: 1, budget: 1500, tier: 2, local: "publicTransport", intercity: "bus", sameProvince: true, fromFile: true,
    back: [bkkBack(["baan-tha-tien"])],
    days: [bkkDay(["grand-palace", "thong-heng-lee", "wat-pho", "wat-arun", "baan-tha-tien"])] },
  bkk2: { province: "กรุงเทพฯ", tagsLabel: "วัด & ไลฟ์สไตล์", n: 2, budget: 5000, tier: 2, local: "publicTransport", intercity: "bus", sameProvince: true, fromFile: true, noHotelData: true,
    back: [bkkBack(["rongros"]), bkkBack(["iconsiam"])],
    days: [bkkDay(["grand-palace", "the-gate-grand-palace", "wat-pho", "rongros"]),
           bkkDay(["mahanakhon-skywalk", "mahanakhon-eatery", "iconsiam"])] }
};

/* ---- calculator (mirror of the planned CostCalculator) ---- */
const rooms = n => Math.ceil(n / 2);
/* same thresholds as CandidateBuilder.priceCap (budget per person per day) */
function priceCap(cfg) { const v = cfg.budget / cfg.n / cfg.days.length; return v < 700 ? 1 : v < 1500 ? 2 : v < 3000 ? 3 : 4; }
/* Legs travelled in one trip: every Stop, plus the way back to the hotel on each night
   and, on a one-day trip, the way back to the start. `approx` = distance mirrored from the way in. */
function legsOf(cfg) {
  const d = cfg.days.length, nights = Math.max(0, d - 1), legs = []; let returns = 0, approx = 0;
  cfg.days.forEach((stops, i) => {
    stops.forEach(s => legs.push(s.km));
    if (i < nights || d === 1) { const known = cfg.back && cfg.back[i] != null;
      legs.push(known ? cfg.back[i] : stops[0].km); returns++; if (!known) approx++; }
  });
  return {legs, returns, approx};
}
function localCost(mode, legs, dayCount, n) {
  const p = PRICE.local[mode], km = legs.reduce((s, x) => s + x, 0);
  if (mode === "publicTransport") return p.trip * n * legs.length;
  if (mode === "taxi") return legs.reduce((s, x) => s + p.base + p.km * x, 0) * Math.ceil(n / p.cap);
  return (p.day * dayCount + p.km * km) * Math.ceil(n / p.cap);      // rentals: every day of the trip
}
function estimate(cfg) {
  const n = cfg.n, dayCount = cfg.days.length, stops = cfg.days.flat();
  const nights = Math.max(0, dayCount - 1), hasHotel = nights > 0;
  // no accommodation data: never 0 -- table price for the tier, flagged, breakfast assumed not included
  const breakfastIn = hasHotel && !cfg.noHotelData && cfg.tier >= PRICE.breakfastIncludedFrom;
  const accommodation = hasHotel ? PRICE.room[cfg.tier] * rooms(n) * nights : 0;
  const meals = stops.filter(s => s.cat === "rest").reduce((s, x) => s + PRICE.meal[x.level] * n, 0);
  // breakfast follows the real days of the trip; mornings covered by the hotel cost nothing
  const paidBreakfasts = dayCount - (breakfastIn ? nights : 0);
  const breakfast = PRICE.breakfast * n * paidBreakfasts;
  const feeOf = x => cfg.feeBasis === "thai" && x.feeThai !== undefined ? x.feeThai : x.fee;
  const attrs = stops.filter(s => s.cat === "attr");
  const unknownFees = attrs.filter(x => feeOf(x) == null).length;        // unknown is not "free"
  const entrance = attrs.reduce((s, x) => s + (feeOf(x) || 0) * n, 0);
  const trip = legsOf(cfg);
  const localTransport = localCost(cfg.local, trip.legs, dayCount, n);
  let intercity = 0;
  if (!cfg.sameProvince) { const ic = PRICE.intercity[cfg.intercity];
    intercity = cfg.intercity === "car" ? ic.km * ic.rate * 2 + ic.toll * 2 : ic.fare * n * 2; }
  const food = meals + breakfast, subtotal = intercity + accommodation + food + entrance + localTransport;
  const buffer = subtotal * PRICE.buffer, total = subtotal + buffer, over = total - cfg.budget > 0.005;
  return {intercity, accommodation, food, entrance, localTransport, buffer, subtotal, total, perPerson: total / n,
    over, softOver: over && subtotal <= cfg.budget, overBy: Math.max(0, total - cfg.budget),
    breakfastIn, breakfast, paidBreakfasts, nights, dayCount, unknownFees, returns: trip.returns, returnsApprox: trip.approx};
}
/* Mirror of CostCalculator.minimumTripCost (#35): the cheapest conceivable trip of d days. */
function minTripCost(cfg, d = cfg.days.length, sameProvince = cfg.sameProvince) {
  const n = cfg.n, ic = PRICE.intercity;
  const inter = sameProvince ? 0 : Math.min(ic.bus.fare * n * 2, ic.train.fare * n * 2, ic.car.km * ic.car.rate * 2 + ic.car.toll * 2);
  const trips = PRICE.min.stopsPerDay * d + (d > 1 ? d - 1 : 1);
  return (inter + PRICE.room[1] * rooms(n) * Math.max(0, d - 1) + PRICE.meal[1] * n * (2 * d - 1) + PRICE.breakfast * n * d
    + PRICE.local.publicTransport.trip * n * trips) * (1 + PRICE.buffer);
}
const dropDay = cfg => ({...cfg, days: cfg.days.slice(0, -1), back: cfg.back ? cfg.back.slice(0, -1) : cfg.back});
function cheapestLocal(cfg) { let best = null;
  for (const m of Object.keys(PRICE.local).filter(m => m !== cfg.local)) { const t = estimate({...cfg, local: m}).total; if (!best || t < best.t) best = {m, t}; }
  return best; }
function advise(cfg, base) {                       // every option priced by the same calculator, except the province lower bound
  const out = [], price = c => estimate(c).total;
  if (cfg.tier > 1 && cfg.days.length > 1) { const c = {...cfg, tier: cfg.tier - 1}, loses = !cfg.noHotelData && c.tier < PRICE.breakfastIncludedFrom && cfg.tier >= PRICE.breakfastIncludedFrom;
    out.push({icon: "hotel", title: `ลดระดับที่พักเป็น ${"฿".repeat(c.tier)}`, text: loses ? "ห้องถูกลง แต่ต้องซื้ออาหารเช้าเองทุกวัน" : "เลือกที่พักระดับราคาต่ำลงหนึ่งขั้น", saving: base.total - price(c), apply: c}); }
  const best = cheapestLocal(cfg);
  if (best && base.total - best.t > 0.5)
    out.push({icon: "commute", title: `เปลี่ยนเป็น${LOCAL_LABEL[best.m]}`, text: `ถูกกว่า${LOCAL_LABEL[cfg.local]}ในทริปนี้`, saving: base.total - best.t, apply: {...cfg, local: best.m}});
  if (cfg.days.length > 1) { const c = dropDay(cfg);
    out.push({icon: "event_busy", title: "ลดทริปลง 1 วัน", text: "ตัดวันสุดท้ายและที่พักคืนสุดท้ายออก", saving: base.total - price(c), apply: c, rough: true}); }
  if (!cfg.sameProvince)
    out.push({icon: "map", title: "เที่ยวในกรุงเทพฯ แทน (ต้นทาง)", text: "ไม่มีค่าเดินทางข้ามเมือง", saving: base.total - minTripCost(cfg, cfg.days.length, true), estimated: true});
  return out.filter(a => a.saving > 0.5).sort((a, b) => (a.estimated ? 1 : 0) - (b.estimated ? 1 : 0) || b.saving - a.saving).slice(0, 3);
}
/* What is left when every applicable option is taken TOGETHER (priced as one plan, never by adding savings). */
function rescue(cfg, e) {
  let c = {...cfg};
  if (c.tier > 1 && c.days.length > 1) c = {...c, tier: c.tier - 1};
  const best = cheapestLocal(c); if (best && best.t < estimate(c).total) c = {...c, local: best.m};
  if (c.days.length > 1) c = dropDay(c);
  const all = estimate(c);
  if (!all.over) return null;                                   // the options are enough: no rescue card
  const d = cfg.days.length, need = minTripCost(cfg);
  let fitDays = 0; for (let k = d - 1; k >= 1; k--) if (minTripCost(cfg, k) <= cfg.budget) { fitDays = k; break; }
  return {stillOver: all.total - cfg.budget, need, needRounded: Math.ceil(need / 100) * 100, fitDays,
    fitCost: fitDays ? minTripCost(cfg, fitDays) : 0, oneDay: minTripCost(cfg, 1)};
}

const clone = o => JSON.parse(JSON.stringify(o));
let scenarioId = "demo3", cfg, feeBasis = "foreign", unknownDemo = false, applied = [], history = [], day = 0, mascotOn = true, openId = null, lastFocus = null, snackTimer = null, io = null;
function load(id) {

}

function feeNote(s) {

  return ` · ชาวต่างชาติ ${baht(s.fee)} · คนไทย ${s.feeThai ? baht(s.feeThai) : "ฟรี"}`;
}
function render() {
  $("app-title").textContent = cfg.province;
  const e = estimate(cfg), pct = Math.round(e.total / Math.max(1, cfg.budget) * 100);

  const tripLabel = `${cfg.province} ${dayLabel} ${cfg.n} คน`;

  const banner = e.over ? `

          ? `ค่าใช้จ่ายจริงอยู่ในงบ แต่รวมเงินสำรองแล้วเกิน ${baht(e.overBy)}` : `แผนนี้เกินงบ ${baht(e.overBy)}`}</h2>

      <div class="daychips" role="group" aria-label="เลือกวัน">${cfg.days.map((_, i) =>
        `<button class="daychip label-l" type="button" data-day="${i}" aria-pressed="${i === day}">วันที่ ${i + 1} · ${DATES[i]}</button>`).join("")}</div>
      <div class="card" style="margin-top:12px">
        <h3 class="title-m day-h"><i aria-hidden="true"></i>กิจกรรมวันที่ ${day + 1} (${DATES[day]})</h3>
        ${cfg.days[day].map((s, i) => `<div class="li"><div class="lead label-m">${i + 1}</div>
          <div><div class="title-s">${s.name}</div><div class="body-s muted">${s.cat === "rest" ? "ร้านอาหาร " + "฿".repeat(s.level) : "สถานที่ท่องเที่ยว"}${feeNote(s)}</div></div></div>`).join("")}
        <p class="body-s muted" style="margin:8px 0 0">${cfg.fromFile ? "ข้อมูลสถานที่จากไฟล์ Excel (สถานที่กรุงเทพ_พร้อมนำเข้า) · ระยะทางคำนวณเส้นตรง × 1.3" : "ข้อมูลตัวอย่างของ prototype"} · ไทม์ไลน์และแผนที่เต็มอยู่ในงาน M7</p>
      </div>
    </section>`;

  $("page").innerHTML = banner + summary + adviceHtml + done + list;
  $("open-cost").onclick = () => openSheet("sheet-cost");
  const go = $("goto-advice"); if (go) go.onclick = ev => { ev.preventDefault(); $("advice").scrollIntoView({behavior: "smooth", block: "start"}); };
  const rb = $("res-budget"); if (rb) rb.onclick = () => { history.push({cfg: clone(cfg), applied: [...applied]}); cfg.budget = res.needRounded; render(); renderSettings(); snack(`ตั้งงบเป็น ${baht(res.needRounded)} แล้ว`); };
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { day = +b.dataset.day; render(); });
  document.querySelectorAll("[data-apply]").forEach(b => b.onclick = () => {
    const a = advice[+b.dataset.apply]; history.push({cfg: clone(cfg), applied: [...applied]});
    applied.push(a.title); cfg = clone(a.apply); render(); renderSettings(); snack(`ทำตาม "${a.title}" แล้ว`); });
  $("costbar-amt").textContent = baht(e.total);
  $("costbar-label").textContent = e.over ? `เกินงบ ${baht(e.overBy)}` : "ค่าใช้จ่ายรวม · อยู่ในงบ";
  $("costbar").classList.toggle("over", e.over);
  observeSummary(); renderCost(e);
}

function renderCost(e) {
  const EST = '<span class="flag est">ประมาณ</span>', REAL = '<span class="flag real">ราคาจริง</span>';
  const backNote = e.returns ? ` · รวมขากลับ${e.dayCount === 1 ? "จุดเริ่มต้น" : "ที่พัก"} ${e.returns} เที่ยว${e.returnsApprox ? " (ประมาณระยะ " + e.returnsApprox + " เที่ยว)" : ""}` : "";
  const rows = [
    ["directions_bus", "เดินทางข้ามเมือง", cfg.sameProvince ? "อยู่ในจังหวัดต้นทาง" : `${IC_LABEL[cfg.intercity]} ไป-กลับ ${cfg.n} คน`, e.intercity, cfg.sameProvince ? "" : EST],
    ["hotel", "ที่พัก", e.nights ? `${PRICE.room[cfg.tier].toLocaleString()} × ${rooms(cfg.n)} ห้อง × ${e.nights} คืน` : "ทริปวันเดียว ไม่มีค่าที่พัก", e.accommodation,
      !e.nights ? "" : cfg.noHotelData ? '<span class="flag warn">ไม่มีข้อมูลที่พัก ใช้ราคาตาราง</span>' : EST],
    ["restaurant", "อาหาร", `มื้อเช้าซื้อเอง ${e.paidBreakfasts} วัน ${baht(e.breakfast)}${e.breakfastIn ? ` · ที่พักรวมเช้า ${e.nights} เช้า` : ""}`, e.food, EST],
    ["confirmation_number", "ค่าเข้าชม", `${cfg.n} คน · ${cfg.feeBasis === "thai" ? "ราคาคนไทย" : "ราคาชาวต่างชาติ"}`, e.entrance,
      e.unknownFees ? `<span class="flag warn">ไม่ทราบ ${e.unknownFees} แห่ง</span>` : REAL],
    ["local_taxi", "เดินทางในพื้นที่", LOCAL_LABEL[cfg.local] + backNote, e.localTransport, EST],
    ["savings", "เงินสำรอง", "10% ของทุกหมวด", e.buffer, ""]];
  $("sheet-cost").innerHTML = `
    <div class="grab" data-grab><i></i></div>
    <div class="body">
      <div class="sheet-head"><h2 class="title-l" id="cost-title">ค่าใช้จ่ายแยกหมวด</h2><button class="icon-btn" type="button" data-close aria-label="ปิด"><span class="ms" aria-hidden="true">close</span></button></div>
      <div class="body-m muted">ราคาโดยประมาณ · ${cfg.n} คน · ${cfg.days.length} วัน</div>
      <div class="stack" aria-hidden="true">${rows.map((r, i) => r[3] > 0 ? `<i style="flex:${r[3]};background:var(--c${i + 1})"></i>` : "").join("")}</div>
      <ul style="list-style:none;margin:0;padding:0">${rows.map((r, i) => `<li class="row-li">
        <div class="lead" style="color:var(--c${i + 1})"><span class="ms" aria-hidden="true">${r[0]}</span></div>
        <div><div class="title-m">${r[1]} ${r[4]}</div><div class="body-s muted">${r[2]}</div></div>
        <div class="trail"><div class="title-m num">${baht(r[3])}</div><div class="body-s muted num">${e.total ? Math.round(r[3] / e.total * 100) : 0}%</div></div></li>`).join("")}</ul>
      <div class="divider"></div>
      <dl class="sumlines body-m" style="margin:4px 0 8px">
        <div><dt>ค่าใช้จ่ายจริง (5 หมวด)</dt><dd class="num">${baht(e.subtotal)}</dd></div>
        <div><dt>เงินสำรอง 10%</dt><dd class="num">+ ${baht(e.buffer)}</dd></div>
      </dl>
      <div class="row-li"><div class="lead" style="background:var(--primary-container);color:var(--on-primary-container)"><span class="ms" aria-hidden="true">functions</span></div>
        <div><div class="title-m">รวมทั้งทริป</div><div class="body-s muted">ต่อคน ${baht(e.perPerson)}</div></div>
        <div class="trail"><div class="title-l num" style="color:${e.over ? "var(--error)" : "var(--primary)"}">${baht(e.total)}</div><div class="body-s muted">งบ ${baht(cfg.budget)}</div></div></div>
      <div class="assume body-s muted"><span class="ms" aria-hidden="true">info</span><span>"ประมาณ" = คำนวณจากตารางราคากลางตามระดับราคา ไม่ใช่ราคาจริงของแต่ละแห่ง · "ราคาจริง" = มาจากข้อมูลสถานที่</span></div>
    </div>`;
  bindSheet("sheet-cost");
}

function renderSettings() {
  const app = $("app");
  const seg = (name, items, cur) => `<div class="seg" role="group" aria-label="${name}">${items.map(([v, l]) =>
    `<button type="button" data-${name}="${v}" aria-pressed="${String(v) === String(cur)}" class="label-l">${l}</button>`).join("")}</div>`;
  $("sheet-set").innerHTML = `
    <div class="grab" data-grab><i></i></div>
    <div class="body">
      <div class="sheet-head"><h2 class="title-l" id="set-title">ตัวเลือกทดลอง</h2><button class="icon-btn" type="button" data-close aria-label="ปิด"><span class="ms" aria-hidden="true">close</span></button></div>
      <div class="body-m muted">ใช้ทดสอบ UI เท่านั้น ไม่ใช่ส่วนหนึ่งของแอป · ยังไม่ได้ commit</div>

      <div class="title-s" style="margin-top:20px">กล้องหน้า / แถบสถานะ (เว้นด้านบน)</div>
      ${seg("cam", [["punch", "รูเจาะ"], ["notch", "รอยบาก"], ["none", "ไม่มี"]], app.dataset.cam)}
      <div class="title-s" style="margin-top:20px">ปุ่มนำทางของเครื่อง (เว้นด้านล่าง)</div>
      ${seg("nav", [["gesture", "ปัดท่าทาง"], ["buttons", "3 ปุ่ม"]], app.dataset.nav)}
      <div class="switch-row"><span class="body-l">แสดงเขตที่ต้องเว้น <span class="body-s muted" style="display:block">แถบแดง = ห้ามวางเนื้อหา · บน: แถบสถานะและกล้องหน้า · ล่าง: ปุ่ม/แถบนำทางของเครื่อง</span></span><input class="switch" id="f-guides" type="checkbox" role="switch" aria-label="แสดงเขตที่ต้องเว้น" ${app.classList.contains("guides") ? "checked" : ""}></div>

      <label class="field"><span class="body-s">สถานการณ์</span>
        <select id="f-scenario"><option value="demo1" ${scenarioId === "demo1" ? "selected" : ""}>Demo 1 · mock ใน repo (2 วัน 2 คน)</option>
        <option value="demo3" ${scenarioId === "demo3" ? "selected" : ""}>Demo 3 · เกินงบ (3 วัน 4 คน งบ 3,000)</option>
        <option value="bkk1" ${scenarioId === "bkk1" ? "selected" : ""}>Demo 2 · กรุงเทพฯ 1 วัน 1 คน งบ 1,500 (ข้อมูล Excel)</option>
        <option value="bkk2" ${scenarioId === "bkk2" ? "selected" : ""}>กรุงเทพฯ 2 วัน 1 คืน 2 คน งบ 5,000 (ข้อมูล Excel)</option></select></label>
      <div class="field"><span class="body-s">จำนวนคน</span>
        <div class="stepper"><button class="icon-btn" type="button" id="n-dec" aria-label="ลดจำนวนคน"><span class="ms" aria-hidden="true">remove</span></button>
          <output class="title-m num" aria-live="polite">${cfg.n} คน</output>
          <button class="icon-btn" type="button" id="n-inc" aria-label="เพิ่มจำนวนคน"><span class="ms" aria-hidden="true">add</span></button></div></div>
      <label class="field"><span class="body-s">งบรวม (บาท)</span><input id="f-budget" type="number" inputmode="numeric" min="500" step="100" value="${cfg.budget}"></label>
      <label class="field"><span class="body-s">เดินทางในพื้นที่</span>
        <select id="f-local">${Object.entries(LOCAL_LABEL).map(([v, l]) => `<option value="${v}" ${cfg.local === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <div class="title-s" style="margin-top:20px">ราคาค่าเข้าชม <span class="body-s muted">(ไฟล์ Excel ใช้ราคาชาวต่างชาติ)</span></div>
      ${seg("fee", [["foreign", "ชาวต่างชาติ"], ["thai", "คนไทย"]], cfg.feeBasis)}
      <div class="title-s" style="margin-top:20px">ระดับที่พัก</div>
      ${seg("tier", [[1, "฿"], [2, "฿฿"], [3, "฿฿฿"], [4, "฿฿฿฿"]], cfg.tier)}

      <div class="switch-row"><span class="body-l">จำลอง: ไม่ทราบค่าเข้าชม 1 แห่ง</span><input class="switch" id="f-unk" type="checkbox" role="switch" aria-label="จำลองไม่ทราบค่าเข้าชม" ${unknownDemo ? "checked" : ""}></div>
      <div class="switch-row"><span class="body-l">ตัวอักษร 200%</span><input class="switch" id="f-big" type="checkbox" role="switch" aria-label="ตัวอักษร 200%" ${document.documentElement.classList.contains("big") ? "checked" : ""}></div>
      <div class="switch-row"><span class="body-l">มาสคอตบน banner (#83)</span><input class="switch" id="f-mascot" type="checkbox" role="switch" aria-label="มาสคอตบน banner" ${mascotOn ? "checked" : ""}></div>
      <button class="btn outlined block" type="button" id="f-reset" style="margin-top:12px">รีเซ็ตสถานการณ์</button>
      <details class="rules body-s muted"><summary class="title-s">กติกาคำนวณที่ใช้ (อนุมัติ 4 ต.ค. 2569)</summary><ol>
        <li>เกินงบ = ยอดรวมที่บวกเงินสำรอง 10% แล้ว มากกว่างบ · แสดงแยก ค่าใช้จ่ายจริง / เงินสำรอง / รวม</li>
        <li>มื้อเช้า 100 บาท/คน นับตามวันจริงของทริป · เช้าที่ที่พักรวมให้ = 0</li>
        <li>ไม่มีข้อมูลที่พัก: ใช้ราคาตารางตามระดับจากงบ (priceCap) ติดธงประมาณ และถือว่าไม่รวมมื้อเช้า</li>
        <li>ค่าเข้าชม: ราคาคนไทย/ต่างชาติยังรอตัดสิน · ไม่มีข้อมูล = "ไม่ทราบ" ไม่ใช่ฟรี</li>
        <li>เดินทางในพื้นที่: นับขากลับที่พักทุกคืน · ทริปวันเดียวนับขากลับจุดเริ่มต้น · วันสุดท้ายของทริปค้างคืนไม่นับ · ไม่รู้ระยะให้ใช้เท่าขามา</li>
        <li>รถเช่านับทุกวันของทริป · ขับรถเองข้ามเมืองแล้วเช่ารถในพื้นที่ นับแยก 2 ช่วง</li>
        <li>คำแนะนำ: คิดราคาด้วยเครื่องคิดเลขเดียวกัน แสดงแยกข้อ ห้ามบวกยอดประหยัด</li>
        <li>ลด 1 วัน = ตัดวันและคืนสุดท้ายของแผนจริง ไม่จัดเส้นทางใหม่ (ติดป้ายประมาณ)</li>
        <li>ทำทุกข้อพร้อมกันแล้วยังเกิน: บอก "ควรมีงบอย่างน้อย" จากค่าใช้จ่ายขั้นต่ำ หรือแนะนำจำนวนวันที่งบพอ</li>
      </ol></details>
    </div>`;
  const set = fn => () => { fn(); render(); renderSettings(); };
  document.querySelectorAll("[data-cam]").forEach(b => b.onclick = () => { app.dataset.cam = b.dataset.cam; renderSettings(); });
  document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { app.dataset.nav = b.dataset.nav; renderSettings(); });
  $("f-guides").onchange = ev => app.classList.toggle("guides", ev.target.checked);
  $("f-scenario").onchange = ev => load(ev.target.value);
  $("n-dec").onclick = set(() => { cfg.n = Math.max(1, cfg.n - 1); });
  $("n-inc").onclick = set(() => { cfg.n = Math.min(8, cfg.n + 1); });
  $("f-budget").oninput = ev => { cfg.budget = Math.max(0, +ev.target.value || 0); render(); };
  $("f-local").onchange = ev => { cfg.local = ev.target.value; render(); };
  document.querySelectorAll("[data-fee]").forEach(b => b.onclick = set(() => { feeBasis = b.dataset.fee; cfg.feeBasis = feeBasis; }));
  document.querySelectorAll("[data-tier]").forEach(b => b.onclick = set(() => { cfg.tier = +b.dataset.tier; }));
  $("f-big").onchange = ev => { document.documentElement.classList.toggle("big", ev.target.checked); document.documentElement.style.fontSize = ev.target.checked ? "32px" : ""; };
  $("f-unk").onchange = ev => { unknownDemo = ev.target.checked; load(scenarioId); };
  $("f-mascot").onchange = ev => { mascotOn = ev.target.checked; render(); };
  $("f-reset").onclick = () => load(scenarioId);
  bindSheet("sheet-set");
}

function openSheet(id) { lastFocus = document.activeElement; openId = id; $("scrim").classList.add("open"); $(id).classList.add("open"); $(id).focus({preventScroll: true}); }
function closeSheet() {
  if (!openId) return;
  $("scrim").classList.remove("open"); $(openId).classList.remove("open"); $(openId).style.transform = ""; openId = null;
  if (lastFocus) lastFocus.focus({preventScroll: true});
}
function bindSheet(id) {
  const root = $(id);
  root.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet);
  const g = root.querySelector("[data-grab]"); let y0 = null;       // drag the handle down to dismiss
  g.onpointerdown = ev => { y0 = ev.clientY; g.setPointerCapture(ev.pointerId); root.style.transition = "none"; };
  g.onpointermove = ev => { if (y0 !== null) root.style.transform = `translateY(${Math.max(0, ev.clientY - y0)}px)`; };
  g.onpointerup = ev => { if (y0 === null) return; const dy = ev.clientY - y0; y0 = null; root.style.transition = ""; root.style.transform = ""; if (dy > 80) closeSheet(); };
}
$("scrim").onclick = closeSheet;
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSheet(); });
$("open-settings").onclick = () => openSheet("sheet-set");
$("costbar-open").onclick = () => openSheet("sheet-cost");
function snack(text) { $("snack-text").textContent = text; $("snack").classList.add("show"); clearTimeout(snackTimer); snackTimer = setTimeout(() => $("snack").classList.remove("show"), 5000); }
$("snack-undo").onclick = () => { const h = history.pop(); if (!h) return; cfg = h.cfg; applied = h.applied; $("snack").classList.remove("show"); render(); renderSettings(); };
$("scroll").addEventListener("scroll", () => $("topbar").classList.toggle("scrolled", $("scroll").scrollTop > 4), {passive: true});
function observeSummary() {
  if (io) io.disconnect(); const el = $("summary"); if (!el) return;
  io = new IntersectionObserver(([en]) => $("costbar").classList.toggle("show", !en.isIntersecting), {root: $("scroll"), threshold: 0.05});
  io.observe(el);
}
load("demo3");
</script>
