# Checks every PR into main and every commit on main after a merge (#118):
# format, analyze, tests with a coverage minimum, a web and Android build
# (#147) and the Firestore security rules (#145).
# The repo is private on the free plan, so this cannot block a merge; it
# shows ✅/❌ on the PR and on the commit instead. See CONTRIBUTING.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR replaces its running check. Every commit on main keeps
# its own run, so a broken merge is always pinned to the commit that broke it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - run: flutter pub get

      - name: dart format (check only)
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - run: flutter analyze

      - run: flutter test --coverage

      # Line coverage of lib/ must stay at 70% or more (#147).
      - run: dart run tool/check_coverage.dart 70

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build:
    name: build web and android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Gradle for the Android build needs Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - run: flutter pub get

      - run: flutter build web --release

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: vaya-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  firestore-rules:
    name: firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore/package-lock.json

      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-vaya --config ../firebase.json "node --test"
